# CLA Assistant (contributor-assistant/github-action) configuration.
# CONSTITUTIONAL EFFECT: ALL pull requests are BLOCKED until the CLA is
# signed. This is not a formality; an unsigned contribution is
# UNCONSTITUTIONAL and cannot enter any savant-framework repository
# (savant-core, clai-os, aegis-ng, aegis-global, grants).
# Deploy: copy this file to .github/workflows/cla.yml in each repository
# (or reference it via workflow reuse). Required secret: CLA_PAT.
# =============================================================================

name: CLA Assistant — Constitutional Signature Gate

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize, reopened, ready_for_review]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-enforcement:
    name: Block All PRs Until CLA Signed
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant (contributor-assistant/github-action)
        if: >-
          (github.event.comment.body == 'recheck' ||
           github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with repo scope, owned by the savant-framework org, used to
          # persist signatures and set blocking commit statuses.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_PAT }}
        with:
          # In-repo CLA document — constitutional instrument, versioned.
          path-to-document: 'https://github.com/savant-framework/savant-core/blob/main/CLA.md'
          # Signature ledger stored in-repo (auditability per GOVERNANCE.md).
          path-to-signatures: 'signatures/version1/cla.json'
          branch: 'main'
          # Block remote/bot accounts; every human contributor signs.
          allowlist: 'savant-s50-checkpoint[bot], dependabot[bot], github-actions[bot]'
          # Lock merged PR threads against post-hoc signature tampering.
          lock-pullrequest-aftermerge: true
          # Signature phrase — typed verbatim by the signer.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-notsigned-prcomment: |
            **CONSTITUTIONAL GATE — CLA UNSIGNED**
            Thank you for your contribution to SAVANT FRAMEWORK. Under
            GOVERNANCE.md (Phase 1) this pull request is BLOCKED until the
            Contributor License Agreement is signed. An unsigned contribution
            is not merely incomplete — it is UNCONSTITUTIONAL and cannot
            merge with zero manual override.

            To sign, post a comment containing exactly:
            > I have read the CLA Document and I hereby sign the CLA

            ...followed by the REQUIRED constitutional identity block below
            (all four fields mandatory):

            ```
            CLA-SIGNATURE-BLOCK
            Real Name: <your legal name>
            Email: <email matching your Signed-off-by DCO line>
            GPG Fingerprint: <40 hexadecimal characters, no spaces>
            Agreement Type: <ICLA | ECLA>
            Employer (ECLA only): <entity authorized to contribute>
            ```

            - ICLA: you contribute as an individual on your own behalf.
            - ECLA: you contribute on behalf of an employer/entity; the
              entity must have executed the Entity CLA with AEGIS-GLOBAL.

            The GPG fingerprint must correspond to the key used for signed
            commits where required by the repository's branch protection.

            Document: https://github.com/savant-framework/savant-core/blob/main/CLA.md
          custom-allsigned-prcomment: |
            **CONSTITUTIONAL GATE — CLA SIGNED**
            All committers have signed the CLA. Signature ledger updated in
            `signatures/version1/cla.json`. This satisfies the CLA gate; the
            remaining constitutional gates (SPOS tag enforcement,
            falsifiability/determinism, S50 checkpoint integrity) still apply.
          # Blocking status context — required by branch protection rules.
          # Branch protection MUST mark this context as required so that an
          # unsigned PR cannot merge even with administrator haste.

# =============================================================================
# CUSTOM FIELD SPECIFICATION (parsed from the CLA-SIGNATURE-BLOCK comment):
#   1. Real Name        — legal identity, matches DCO Signed-off-by line.
#   2. Email            — must equal the DCO sign-off email on every commit.
#   3. GPG Fingerprint  — exactly 40 hexadecimal characters (SHA-1 OpenPGP
#                         fingerprint); no spaces; uppercase or lowercase
#                         accepted, stored uppercase.
#   4. Agreement Type   — ICLA (individual) or ECLA (entity/employer); ECLA
#                         requires the Employer field and a pre-executed
#                         Entity CLA on file with AEGIS-GLOBAL.
# =============================================================================
# FALSIFIABILITY TEST (this configuration):
#   Claim: "No pull request can merge into a protected savant-framework
#   branch without a recorded CLA signature."
#   Falsification procedure:
#     1. Open a PR from an unsigned account. Expected: CLA Assistant posts
#        the blocking comment and sets a failing/pending status; branch
#        protection blocks merge. If merge succeeds, the claim is falsified.
#     2. Post the signature phrase WITHOUT the CLA-SIGNATURE-BLOCK custom
#        fields. Expected: signature rejected as constitutionally incomplete
#        (missing real name / email / 40-char GPG fingerprint / ICLA-ECLA).
#   The failure does not propagate stochastic uncertainty: signature state
#   is a deterministic ledger lookup.
# =============================================================================
