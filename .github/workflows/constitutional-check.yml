# -----------------------------------------------------------------------------
# This workflow is NOT a quality gate. It is a constitutional enforcement
# mechanism. A commit or PR title without a valid SPOS layer tag is not
# "low quality" — it is UNCONSTITUTIONAL and is rejected with zero manual
# review. Accepted tags (case-sensitive, leading position, followed by a
# single space):
#   [L0-KERNEL] [L1-AUDIT] [L2-STRATEGIC] [L3-TACTICAL] [L4-AGENTIC]
#   [L5-EXECUTION]
# =============================================================================

name: Constitutional Check — SPOS Layer Tag Enforcement

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [main, master, develop, 'release/**']
  push:
    branches: [main, master, develop, 'release/**']

permissions:
  contents: read
  pull-requests: read

env:
  # Canonical SPOS v1.0 layer tag regex. Anchored to start of subject line.
  # Case-sensitive by design: [l3-tactical] is UNCONSTITUTIONAL (documented).
  TAG_REGEX: '^\[(L0-KERNEL|L1-AUDIT|L2-STRATEGIC|L3-TACTICAL|L4-AGENTIC|L5-EXECUTION)\] .+'

jobs:
  enforce-spos-tag:
    name: Enforce SPOS Layer Tags (Zero-Manual-Review Rejection)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history for commit-range audit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR title against SPOS constitution
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          echo "PR title under constitutional review: ${PR_TITLE}"
          if [[ "${PR_TITLE}" =~ ${TAG_REGEX} ]]; then
            echo "CONSTITUTIONAL: PR title carries a valid SPOS layer tag."
          else
            echo "::error title=UNCONSTITUTIONAL PR::This pull request violates GOVERNANCE.md (SPOS v1.0)."
            echo "=================================================================="
            echo "UNCONSTITUTIONAL — PULL REQUEST REJECTED BY THE CONSTITUTION"
            echo "=================================================================="
            echo "This pull request does not fail a quality bar; it violates the"
            echo "SAVANT FRAMEWORK constitution. Per GOVERNANCE.md (SPOS v1.0),"
            echo "every PR title MUST begin with a valid SPOS layer tag."
            echo ""
            echo "Received title: ${PR_TITLE}"
            echo ""
            echo "Correct format:"
            echo "  [L3-TACTICAL] feat(aegis-ng): add F-04 TFLite Micro model M-03"
            echo ""
            echo "Accepted tags (case-sensitive, must lead the title):"
            echo "  [L0-KERNEL] [L1-AUDIT] [L2-STRATEGIC] [L3-TACTICAL]"
            echo "  [L4-AGENTIC] [L5-EXECUTION]"
            echo "=================================================================="
            exit 1
          fi

      - name: Validate commit messages against SPOS constitution
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          UNCONSTITUTIONAL=0
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          else
            if [ "${EVENT_BEFORE}" = "0000000000000000000000000000000000000000" ]; then
              RANGE="HEAD~1..HEAD"
            else
              RANGE="${EVENT_BEFORE}..HEAD"
            fi
          fi
          echo "Auditing commit range: ${RANGE}"
          while IFS= read -r subject; do
            [ -z "${subject}" ] && continue
            # Merge commits generated by GitHub are exempt by convention.
            case "${subject}" in
              "Merge pull request "*|"Merge branch "*) continue ;;
            esac
            if [[ "${subject}" =~ ${TAG_REGEX} ]]; then
              echo "CONSTITUTIONAL: ${subject}"
            else
              UNCONSTITUTIONAL=1
              echo "::error::UNCONSTITUTIONAL COMMIT: ${subject}"
              echo "------------------------------------------------------------------"
              echo "UNCONSTITUTIONAL COMMIT DETECTED: ${subject}"
              echo "This commit violates GOVERNANCE.md (SPOS v1.0). The rejection is"
              echo "constitutional, not stylistic: untagged work cannot be traced to"
              echo "a sovereign layer and therefore cannot enter the repository."
              echo ""
              echo "Correct format:"
              echo "  [L3-TACTICAL] feat(aegis-ng): add F-04 TFLite Micro model M-03"
              echo "Accepted tags: [L0-KERNEL] [L1-AUDIT] [L2-STRATEGIC]"
              echo "               [L3-TACTICAL] [L4-AGENTIC] [L5-EXECUTION]"
              echo "------------------------------------------------------------------"
            fi
          done < <(git log --format=%s "${RANGE}")
          if [ "${UNCONSTITUTIONAL}" -ne 0 ]; then
            echo "=================================================================="
            echo "CONSTITUTIONAL RULING: This change set is UNCONSTITUTIONAL."
            echo "Authority: GOVERNANCE.md · SPOS v1.0 · SIP v1.0 trigger HARDEN."
            echo "Remedy: amend/rebase every offending commit to carry a valid SPOS"
            echo "layer tag, then force-push. No manual override exists."
            echo "=================================================================="
            exit 1
          fi
          echo "CONSTITUTIONAL RULING: All commits in range carry valid SPOS layer tags."

# =============================================================================
# FALSIFIABILITY TEST (this workflow):
#   Claim: "A contributor cannot land a commit or PR without a valid SPOS
#   layer tag without automatic constitutional rejection."
#   Falsification procedure:
#     1. Push a commit with message "feat: add new feature".
#        Expected: this job fails with the UNCONSTITUTIONAL banner. If it
#        passes, the claim above is falsified and this gate is broken.
#     2. Open a PR titled "[L9-NONEXISTENT] bad layer".
#        Expected: rejection (L9 is not a sovereign layer).
#     3. Push "[L3-TACTICAL] feat(aegis-ng): add F-04 TFLite Micro model M-03".
#        Expected: acceptance. If rejected, the gate is over-broad.
#   The failure does not propagate stochastic uncertainty: the regex is
#   anchored, case-sensitive, and enumerated; outcomes are binary and
#   reproducible for identical inputs.
# =============================================================================
