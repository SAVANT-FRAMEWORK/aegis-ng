# Assertion ethos (constitutional, printed in job output on every failure):
#   "The failure does not propagate stochastic uncertainty."
# Meaning: a failing falsifiability gate is a deterministic verdict on a
# deterministic claim. Any path marked deterministic/ MUST be free of
# stochastic constructs: unseeded random calls, temperature>0 model
# invocations, and timestamp-dependent branching.
# =============================================================================

name: Falsifiability Test — Deterministic Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, master, develop, 'release/**']
  push:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  test-suite:
    name: Execute Repository Test Suite (if present)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        if: hashFiles('requirements.txt', 'pyproject.toml', 'setup.py') != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Python test suite
        if: hashFiles('requirements.txt', 'pyproject.toml', 'setup.py') != ''
        run: |
          set -euo pipefail
          [ -f requirements.txt ] && pip install -r requirements.txt
          pip install pytest
          if [ -d tests ] || ls test_*.py >/dev/null 2>&1; then
            pytest -q --tb=short || {
              echo "::error title=FALSIFIABILITY FAILURE::The failure does not propagate stochastic uncertainty. The test suite failed deterministically; the claim under test is falsified."
              exit 1
            }
          else
            echo "No Python tests discovered; suite step is a no-op by constitution."
          fi

      - name: Run Node test suite
        if: hashFiles('package.json') != ''
        run: |
          set -euo pipefail
          if grep -q '"test"' package.json; then
            npm ci && npm test || {
              echo "::error title=FALSIFIABILITY FAILURE::The failure does not propagate stochastic uncertainty."
              exit 1
            }
          else
            echo "package.json declares no test script; suite step is a no-op."
          fi

      - name: Run Make-based test target
        if: hashFiles('Makefile') != ''
        run: |
          set -euo pipefail
          if grep -qE '^test:' Makefile; then
            make test || {
              echo "::error title=FALSIFIABILITY FAILURE::The failure does not propagate stochastic uncertainty."
              exit 1
            }
          else
            echo "Makefile has no test target; suite step is a no-op."
          fi

  determinism-check:
    name: Determinism Scan — deterministic/ Paths Must Be Stochastic-Free
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan changed deterministic/ files for stochastic constructs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Constitutional ethos line — printed verbatim in every output:
          echo "ETHOS: The failure does not propagate stochastic uncertainty."

          if [ "${EVENT_NAME}" = "pull_request" ]; then
            DIFF_RANGE="${BASE_SHA}...${HEAD_SHA}"
          else
            DIFF_RANGE="HEAD~1...HEAD"
          fi

          CHANGED=$(git diff --name-only "${DIFF_RANGE}" | grep -E '(^|/)deterministic/' || true)
          if [ -z "${CHANGED}" ]; then
            echo "No changed files under deterministic/ paths; scan is a no-op."
            exit 0
          fi

          echo "Files under constitutional determinism review:"
          echo "${CHANGED}"
          VIOLATIONS=0

          scan_file() {
            local file="$1"
            # 1. Unseeded randomness: random.* / np.random.* / Math.random without
            #    an accompanying seed in the same file.
            if grep -nE '(^|[^_a-zA-Z])(random\.(random|randint|choice|shuffle|uniform|gauss|sample)|np\.random\.|Math\.random\()' "${file}" >/dev/null 2>&1; then
              if ! grep -nE '(random\.seed|np\.random\.seed|seed_everything|set_seed|\.Seed\()' "${file}" >/dev/null 2>&1; then
                echo "::error file=${file}::STOCHASTIC CONSTRUCT: unseeded random call in a deterministic/ path."
                VIOLATIONS=1
              fi
            fi
            # 2. temperature > 0 model invocation (any non-zero literal).
            if grep -nE 'temperature\s*[=:]\s*(0*[1-9][0-9.]*|0?\.0*[1-9][0-9]*)' "${file}" >/dev/null 2>&1; then
              echo "::error file=${file}::STOCHASTIC CONSTRUCT: temperature>0 model invocation in a deterministic/ path."
              VIOLATIONS=1
            fi
            # 3. Timestamp-dependent logic: now()/time()/Date used in control flow.
            if grep -nE '(datetime\.now\(|time\.time\(|Date\.now\(|new Date\(|time\.Now\()' "${file}" >/dev/null 2>&1; then
              echo "::error file=${file}::STOCHASTIC CONSTRUCT: timestamp-dependent logic in a deterministic/ path (use injected/clock-fixed time)."
              VIOLATIONS=1
            fi
          }

          while IFS= read -r f; do
            [ -f "${f}" ] && scan_file "${f}"
          done <<< "${CHANGED}"

          if [ "${VIOLATIONS}" -ne 0 ]; then
            echo "=================================================================="
            echo "UNCONSTITUTIONAL — DETERMINISM VIOLATION IN deterministic/ PATHS"
            echo "Authority: GOVERNANCE.md · SPOS v1.0 · S50 Absolute engine."
            echo "A reasoning chain marked deterministic produced stochastic output"
            echo "where deterministic output is constitutionally required."
            echo "The failure does not propagate stochastic uncertainty."
            echo "Remedy: seed all randomness, set temperature=0, and inject time"
            echo "as a fixed dependency. No manual override exists."
            echo "=================================================================="
            exit 1
          fi

          echo "CONSTITUTIONAL RULING: All changed deterministic/ files are stochastic-free."
          echo "The failure does not propagate stochastic uncertainty."

# =============================================================================
# FALSIFIABILITY TEST (this workflow):
#   Claim: "Any stochastic construct introduced into a deterministic/ path
#   fails this pipeline deterministically."
#   Falsification procedure:
#     1. Add `x = random.random()` (no seed) under deterministic/ in a PR.
#        Expected: determinism-check fails. If it passes, the claim is
#        falsified and this gate is broken.
#     2. Add `temperature = 0.7` to a model call under deterministic/.
#        Expected: failure with the constitutional banner.
#     3. Add a seeded RNG (random.seed(42) + random.random) under
#        deterministic/. Expected: acceptance. If rejected, over-broad.
#   The failure does not propagate stochastic uncertainty.
# =============================================================================
